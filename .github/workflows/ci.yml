name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:

jobs:
  build:
    runs-on: windows-2022

    steps:
      - uses: actions/checkout@v4

      - name: Checkout AviUtl2 SDK
        shell: pwsh
        run: |
          git clone --filter=blob:none --no-checkout https://github.com/aviutl2/aviutl2_sdk_mirror.git .deps/aviutl2_sdk
          git -C .deps/aviutl2_sdk fetch --depth=1 origin 5753e971f831ccc27d06e89920914001650d0224
          git -C .deps/aviutl2_sdk checkout --detach FETCH_HEAD

      - name: Configure
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64 -DMOJIE_AVIUTL2_SDK_DIR="${{ github.workspace }}/.deps/aviutl2_sdk"

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Test
        working-directory: build
        run: ctest -C Release --output-on-failure

      - name: Package
        shell: pwsh
        run: ./scripts/package.ps1 -Configuration Release -SkipBuild

      - uses: actions/upload-artifact@v4
        with:
          name: mojie-release-candidate
          path: |
            dist/*.au2pkg.zip
            dist/*.sha256
          if-no-files-found: error
